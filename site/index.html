<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CP Sklad — Tahlil tizimi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>

<style>
:root{
  --bg:#f4f7fc;--panel:#fff;--ink:#0d1b2e;--muted:#64748b;--line:#e4eaf2;--line2:#eef2f8;
  --sidebar:#0d2747;--sidebar-2:#15355f;--sidebar-ink:#aac1de;
  --primary:#2563eb;--primary-d:#1d4fd0;--primary-bg:#eaf1ff;--accent:#0ea5e9;
  --green:#15a05a;--green-bg:#e6f7ee;--red:#e23b3b;--red-bg:#fdeaea;
  --amber:#e08e0b;--amber-bg:#fdf3e0;--blue-bg:#e8f0ff;--purple:#8b5cf6;
  --shadow:0 1px 3px rgba(13,27,46,.06),0 1px 2px rgba(13,27,46,.04);--shadow-lg:0 6px 22px rgba(13,27,46,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",-apple-system,Roboto,Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:var(--sidebar);color:var(--sidebar-ink);display:flex;flex-direction:column;position:fixed;height:100vh;z-index:20}
.brand{padding:22px 20px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand b{color:#fff;font-size:18px}
.brand span{display:block;font-size:10.5px;color:#6f8bb0;margin-top:3px;text-transform:uppercase;letter-spacing:2px}
.nav{flex:1;padding:12px 0;overflow-y:auto}
.nav a{display:flex;align-items:center;gap:12px;padding:12px 22px;color:var(--sidebar-ink);cursor:pointer;font-weight:500;border-left:3px solid transparent;transition:.15s}
.nav a:hover{background:var(--sidebar-2);color:#fff}
.nav a.active{background:var(--sidebar-2);color:#fff;border-left-color:var(--accent);font-weight:600}
.nav a .ic{width:20px;text-align:center;font-size:15px;opacity:.92}
.sidebar .foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:#5d76a0}
.main{margin-left:250px;flex:1;min-width:0}
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:0 28px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:var(--shadow)}
.topbar h1{font-size:19px;font-weight:700}
.topbar .tools{display:flex;gap:8px}
.content{padding:26px 28px 70px}
.btn{background:var(--primary);color:#fff;border:none;padding:10px 17px;border-radius:9px;font-weight:600;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:.15s;box-shadow:var(--shadow)}
.btn:hover{background:var(--primary-d)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#f6f9fd;border-color:#cdd9e8}
.btn.green{background:var(--green)}.btn.green:hover{filter:brightness(.94)}
.btn.sm{padding:7px 12px;font-size:12px}.btn.danger{background:var(--red)}
.btn.icon{padding:6px 9px;font-size:12px;background:#fff;color:var(--muted);border:1px solid var(--line)}
.btn.icon:hover{background:#f3f7fd;color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-bottom:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);transition:.15s}
.card:hover{box-shadow:var(--shadow-lg)}
.card .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.card .val{font-size:27px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
.card .sub{font-size:12px;color:var(--muted);margin-top:4px}
.card.accent{border-top:3px solid var(--primary)}.card.danger-c{border-top:3px solid var(--red)}.card.green-c{border-top:3px solid var(--green)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:22px;box-shadow:var(--shadow)}
.panel h2{font-size:15.5px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel h2 .hint{font-size:12px;color:var(--muted);font-weight:500}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
input,select{padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);min-width:130px;transition:.15s}
input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f3f7fd;text-align:left;padding:11px 13px;font-weight:700;color:#33486a;border-bottom:2px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:10px 13px;border-bottom:1px solid var(--line2)}
tbody tr:hover td{background:#f8fbff}
.num{text-align:right;font-variant-numeric:tabular-nums}.center{text-align:center}.right{text-align:right}
.tbl-wrap{overflow:auto;max-height:64vh;border:1px solid var(--line);border-radius:11px}
.pill{display:inline-block;padding:3px 11px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-tez{background:var(--green-bg);color:#0c7a42}.p-sekin{background:var(--amber-bg);color:#9a6410}
.p-turgan{background:var(--red-bg);color:#c12626}.p-normal{background:#eef2f8;color:#516379}.p-yangi{background:var(--blue-bg);color:#1d4fd0}
.lowqty{background:var(--red-bg)!important;color:#c12626;font-weight:700}
.region-tag{font-size:11px;color:var(--muted);background:#eff3f9;padding:2px 9px;border-radius:6px;display:inline-block}
.empty{padding:46px;text-align:center;color:var(--muted)}
.link{cursor:pointer;color:var(--primary);font-weight:600}.link:hover{text-decoration:underline}
.timeline{max-height:420px;overflow:auto;padding-right:6px}
.tl-item{position:relative;padding:9px 0 9px 20px;border-left:2px solid var(--line);margin-left:5px}
.tl-item::before{content:"";position:absolute;left:-7px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid #fff}
.tl-item.initial::before{background:var(--purple)}.tl-item.delivery::before{background:var(--amber)}.tl-item.count::before{background:var(--green)}.tl-item.sale::before{background:var(--primary)}
.tl-date{font-weight:700;font-size:12px}.tl-desc{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;bottom:26px;right:26px;background:var(--ink);color:#fff;padding:14px 22px;border-radius:11px;font-weight:600;z-index:200;opacity:0;transform:translateY(12px);transition:.25s;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateY(0)}
.tabs2{display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap}
.tabs2 button{background:#fff;border:1px solid var(--line);padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.tabs2 button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.flexbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.chart-box{position:relative;height:300px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:1050px){.split{grid-template-columns:1fr}}
.muted{color:var(--muted)}
.warn{background:var(--amber-bg);border:1px solid #f2dca6;color:#7a5710;padding:12px 15px;border-radius:10px;font-size:13px;margin-bottom:16px}
.info{background:var(--primary-bg);border:1px solid #c7dbff;color:#1d4fd0;padding:12px 15px;border-radius:10px;font-size:13px;margin-bottom:16px}
.ok{background:var(--green-bg);border:1px solid #b3e6cb;color:#0c7a42;padding:12px 15px;border-radius:10px;font-size:13px;margin-bottom:16px}
.file-hidden{display:none}
.search-wrap{position:relative}.search-wrap input{padding-left:34px;width:240px}
.search-wrap::before{content:"🔍";position:absolute;left:11px;top:9px;font-size:13px;opacity:.5}
.grid-input{width:100px!important;min-width:80px!important;text-align:right}
.amal-yuk{color:var(--amber);font-weight:600}.amal-sotuv{color:var(--primary);font-weight:600}.amal-sanoq{color:var(--green);font-weight:600}.amal-bosh{color:var(--purple);font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(13,27,46,.45);display:flex;align-items:center;justify-content:center;z-index:300}
.modal{background:#fff;border-radius:14px;padding:24px;width:380px;box-shadow:var(--shadow-lg)}
.modal h3{font-size:16px;margin-bottom:16px}
.modal .row{margin-bottom:16px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
@media(max-width:760px){.sidebar{width:60px}.brand b,.brand span,.nav a span:not(.ic),.sidebar .foot{display:none}.main{margin-left:60px}.nav a{justify-content:center;padding:14px}}
</style>
</head>

// ===== HIMOYA: sayt + bot bitta bazada ishlaydi (3 tomonlama birlashtirish) =====
// Sayt butun bazani bitta blok qilib saqlaydi. Sahifa ochiq turganda bot sanoq
// qo'shishi, o'chirishi yoki sonini tuzatishi mumkin. Saqlashdan oldin bulutni
// qayta o'qiymiz va oxirgi sinxron holat (BASE) bilan solishtiramiz:
//   • bulutda yangi paydo bo'lgan yozuv  -> bizga qo'shiladi
//   • bulutda o'chirilgan (biz tegmagan)  -> bizda ham o'chadi (qaytib tirilmaydi)
//   • bulutda o'zgargan (biz tegmagan)    -> bulutdagi versiya olinadi
//   • biz o'chirgan/o'zgartirgan          -> bizniki qoladi
let BASE_SEQ=null;   // bulut bilan oxirgi sinxronlangan paytdagi seq
let BASE=null;       // {massiv: Map(id -> imzo)} — oxirgi sinxron holat
const SYNC_KEYS=['clients','products','initialStock','sales','counts','deliveries'];
function _canon(x){if(Array.isArray(x))return '['+x.map(_canon).join(',')+']';
  if(x&&typeof x==='object')return '{'+Object.keys(x).sort().map(k=>JSON.stringify(k)+':'+_canon(x[k])).join(',')+'}';
  return JSON.stringify(x);}
function _recSig(x){return [x.id,x.clientId,x.productId,x.date,x.time||'',x.qty].join('|');}
function _hasId(x){return x&&(typeof x.id==='number'||typeof x.id==='string')&&x.id!=='';}
function snapBase(src){BASE={};SYNC_KEYS.forEach(k=>{const m=new Map();
  (src&&src[k]||[]).forEach(x=>{if(_hasId(x))m.set(String(x.id),_canon(x));});BASE[k]=m;});
  BASE_SEQ=(src&&src.seq)||1;}
function mergeCloud(cloud){
  const st={added:0,removed:0,updated:0};
  if(!cloud||!BASE)return st;
  SYNC_KEYS.forEach(k=>{
    if(!Array.isArray(cloud[k])&&!Array.isArray(DB[k]))return;
    const base=BASE[k]||new Map(),local=DB[k]||(DB[k]=[]),cl=cloud[k]||[];
    const cmap=new Map();cl.forEach(x=>{if(_hasId(x))cmap.set(String(x.id),x);});
    const isRec=!(k==='clients'||k==='products');
    const out=[],seen=new Set();
    local.forEach(x=>{
      if(!_hasId(x)){out.push(x);return;}
      const id=String(x.id),b=base.get(id),c=cmap.get(id);seen.add(id);
      if(b!==undefined&&c===undefined){
        if(_canon(x)===b){st.removed++;return;}   // boshqa joyda o'chirilgan -> o'chiramiz
        out.push(x);return;}                      // biz o'zgartirganmiz -> qoldiramiz
      if(b!==undefined&&c!==undefined&&_canon(x)===b&&_canon(c)!==b){out.push({...c});st.updated++;return;}
      out.push(x);});
    // bulutda yangi paydo bo'lganlar
    const ids=new Set(out.filter(_hasId).map(x=>String(x.id)));
    const sigs=isRec?new Set(out.map(_recSig)):null;
    cl.forEach(x=>{if(!_hasId(x))return;const id=String(x.id);
      if(base.has(id))return;                          // eski yozuv: yuqorida hal qilindi
      if(isRec&&sigs.has(_recSig(x)))return;            // aynan shu yozuv bizda bor
      if(seen.has(id)){const mine=out.find(z=>String(z.id)===id);
        if(mine&&_canon(mine)===_canon(x))return;}      // bir xil — hech narsa qilmaymiz
      const y={...x};
      if(ids.has(id)){
        if(isRec)y.id=nextId();                        // id to'qnashsa — yangi id
        else{ // bizda yangi qo'shilgan klent/tovar bilan id to'qnashdi -> biznikiga yangi id
          const mine=out.find(z=>String(z.id)===id);
          const nid=Math.max(0,...out.map(z=>+z.id||0),...cl.map(z=>+z.id||0))+1;
          const ref=k==='clients'?'clientId':'productId';
          ['initialStock','sales','counts','deliveries'].forEach(r=>(DB[r]||[]).forEach(z=>{if(String(z[ref])===id)z[ref]=nid;}));
          mine.id=nid;ids.add(String(nid));}}
      out.push(y);ids.add(String(y.id));if(isRec)sigs.add(_recSig(y));st.added++;});
    DB[k]=out;});
  if((cloud.seq||0)>DB.seq)DB.seq=cloud.seq;
  return st;}
function _mergeToast(st,pref){const p=[];
  if(st.added)p.push(st.added+' ta yangi');if(st.removed)p.push(st.removed+' ta o\'chirilgan');
  if(st.updated)p.push(st.updated+' ta tuzatilgan');
  if(p.length)toast((pref||'Bot/boshqa oynadan: ')+p.join(', '));}

// ===== ANALYSIS (reconciliation) =====
// Hodisalar: boshlang'ich qoldiq, sotuv(-), sanoq(qoldiq kuzatildi).
// Sanoqda: farq = sanalgan - hisobiy. farq>0 => yuk oldi; farq<0 => qo'shimcha sotilgan.
function analyzeClientProduct(clientId,productId,upto){
  upto=upto||'9999-12-31';
  const init=DB.initialStock.find(s=>s.clientId==clientId&&s.productId==productId);
  const sales=DB.sales.filter(s=>s.clientId==clientId&&s.productId==productId&&s.date<=upto);
  const counts=DB.counts.filter(c=>c.clientId==clientId&&c.productId==productId&&c.date<=upto);
  const ev=[];
  if(init)ev.push({t:dt(init),date:init.date,time:init.time,type:'initial',qty:init.qty,id:init.id});
  sales.forEach(s=>ev.push({t:dt(s),date:s.date,time:s.time,type:'delivery',qty:s.qty,id:s.id}));
  counts.forEach(c=>ev.push({t:dt(c),date:c.date,time:c.time,type:'count',qty:c.qty,id:c.id}));
  ev.sort((a,b)=>a.t.localeCompare(b.t)||({initial:0,delivery:1,count:2}[a.type]-{initial:0,delivery:1,count:2}[b.type]));
  // book = klent omboridagi qoldiq. Biz bergan yuk (+) oshiradi, sanoq haqiqiy qoldiqni ko'rsatadi.
  // Sanoqda qoldiq kamaygan bo'lsa => klent shuncha sotgan.
  let book=0,sold=0,delivered=0,started=false;const ledger=[];
  ev.forEach(e=>{
    if(e.type==='initial'){book=e.qty;started=true;ledger.push({...e,remaining:book,note:"Boshlang'ich qoldiq",delta:e.qty});}
    else if(e.type==='delivery'){book+=e.qty;delivered+=e.qty;started=true;ledger.push({...e,remaining:book,note:'Sotuv (biz berdik)',delta:e.qty});}
    else if(e.type==='count'){
      let note='Sanoq',extra=0;
      if(started){const diff=e.qty-book;
        if(diff<-0.001){sold+=(-diff);note='Sanoq — klent sotdi ('+fmt1(-diff)+')';extra=diff;}
        else if(diff>0.001){delivered+=diff;note="Sanoq — qo'shimcha kirim (+"+fmt1(diff)+')';extra=diff;}
      }
      book=e.qty;started=true;ledger.push({...e,remaining:book,note,delta:extra,isCount:true});
    }
  });
  // Davrlar — kuzatuvlar (boshlang'ich/sanoq) orasidagi aniq tahlil
  const intervals=[];let prevObs=null,pend=0,pendFrom=null,pendTo=null;
  ev.forEach(e=>{
    if(e.type==='initial'){prevObs={date:e.date,time:e.time,qty:e.qty};pend=0;pendFrom=null;pendTo=null;}
    else if(e.type==='delivery'){pend+=e.qty;if(!pendFrom)pendFrom=e.date;pendTo=e.date;}
    else if(e.type==='count'){
      // Oldingi kuzatuv (boshlang'ich/sanoq) bo'lmasa-da, shu sanoqgacha yuk berilgan bo'lsa:
      // boshlang'ich qoldiqni 0 deb olib, Sotdi = 0 + berilgan yuk - sanoq hisoblanadi.
      if(prevObs||pend>0){
        const startQty=prevObs?prevObs.qty:0;
        const startDate=prevObs?prevObs.date:(pendFrom||e.date);
        const raw=startQty+pend-e.qty;const dys=Math.max(daysBetween(startDate,e.date),0);
        intervals.push({from:startDate,fromT:prevObs?prevObs.time:'',to:e.date,toT:e.time,startQty,delivered:pend,delivFrom:pendFrom,delivTo:pendTo,endQty:e.qty,sold:raw>0?raw:0,rawSold:raw,days:dys,daily:(dys>0&&raw>0)?raw/dys:0});
      }
      prevObs={date:e.date,time:e.time,qty:e.qty};pend=0;pendFrom=null;pendTo=null;
    }
  });
  let lastSaleDate=null;intervals.forEach(iv=>{if(iv.sold>0.001)lastSaleDate=iv.to;});
  const obsCount=(init?1:0)+counts.length;
  const current=book;
  const firstDate=ev.length?ev[0].date:null,lastDate=ev.length?ev[ev.length-1].date:null;
  const span=firstDate?Math.max(daysBetween(firstDate,lastDate),0):0;
  const perDay=span>0?sold/span:0,cover=perDay>0?current/perDay:null;
  const daysSinceLast=lastDate?daysBetween(lastDate,today()):0;
  const daysSinceLastSale=lastSaleDate?daysBetween(lastSaleDate,today()):(firstDate?daysBetween(firstDate,today()):0);
  return {clientId,productId,init:init?init.qty:0,sold,delivered,current,perDay,monthly:perDay*30,cover,span,obsCount,firstDate,lastDate,daysSinceLast,lastSaleDate,daysSinceLastSale,intervals,ledger,price:(productById(productId)||{}).price||0};
}
function statusOf(a){
  if(a.obsCount<2){if(a.current>0&&a.daysSinceLastSale>=STUCK_DAYS)return 'turgan';return 'yangi';}
  if(a.current>0&&a.daysSinceLastSale>=STUCK_DAYS)return 'turgan';
  if(a.cover!==null){if(a.cover<=FAST_COVER)return 'tez';if(a.cover>=SLOW_COVER)return 'sekin';}
  return 'normal';
}
const STATUS_LBL={tez:'🟢 Tez',sekin:'🟠 Sekin',turgan:'🔴 Turib qolgan',normal:'⚪ Normal',yangi:'🔵 Yangi'};
const STATUS_TXT={tez:'Tez sotyapti',sekin:'Sekin',turgan:'Turib qolgan',normal:'Normal',yangi:'Yangi'};
const STATUS_CLS={tez:'p-tez',sekin:'p-sekin',turgan:'p-turgan',normal:'p-normal',yangi:'p-yangi'};
const ORD={turgan:0,sekin:1,normal:2,tez:3,yangi:4};
function clientProducts(clientId){const ids=new Set();
  DB.initialStock.forEach(s=>{if(s.clientId==clientId)ids.add(s.productId);});
  DB.sales.forEach(s=>{if(s.clientId==clientId)ids.add(s.productId);});
  DB.counts.forEach(c=>{if(c.clientId==clientId)ids.add(c.productId);});return [...ids];}
function analyzeClient(clientId,upto){
  const prods=clientProducts(clientId).map(pid=>analyzeClientProduct(clientId,pid,upto));
  const sold=prods.reduce((s,p)=>s+p.sold,0),current=prods.reduce((s,p)=>s+p.current,0);
  const currentVal=prods.reduce((s,p)=>s+p.current*p.price,0),soldVal=prods.reduce((s,p)=>s+p.sold*p.price,0);
  const delivered=prods.reduce((s,p)=>s+p.delivered,0),perDay=prods.reduce((s,p)=>s+p.perDay,0);
  const lastDate=prods.reduce((d,p)=>p.lastDate&&p.lastDate>d?p.lastDate:d,'');
  let status='yangi';prods.forEach(p=>{const s=statusOf(p);if(status==='yangi'||ORD[s]<ORD[status])status=s;});
  return {clientId,prods,sold,current,currentVal,soldVal,delivered,perDay,monthly:perDay*30,lastDate,status,hasLow:prods.some(p=>p.current>0&&p.current<=LOW_STOCK)};
}
function hasData(clientId){return clientProducts(clientId).length>0;}
// merged ledger across products
function clientLedger(cid){
  let all=[];clientProducts(cid).forEach(pid=>{const a=analyzeClientProduct(cid,pid);
    a.ledger.forEach(l=>all.push({...l,productName:productById(pid).name}));});
  all.sort((a,b)=>b.t.localeCompare(a.t));return all;}

// ===== 1C MAHSULOT NOM MOSLASHTIRISH =====
// 1C'dagi eski/boshqa nom -> saytdagi tovar (tartib muhim: aniqroq kalit oldinda).
// 2026-10: Concrete -> Kreta, Dom Stroy (22/07/Nalivnoy/Oq fasad) -> Remost/ForGips nomiga o'tgan.
const PRODUCT_ALIASES={
  'concrete 22':'Kreta 75 Uselinniy 25kg (Suxoy)',
  'concrete 75':'Kreta 75 Uselinniy 25kg (Suxoy)',
  'concrete rodband':'Kreta Rodband 25 kg',
  'concrete ichki saten 01':'Kreta 01 20kg (Suxoy)',
  'concrete 01 shpaklovka':'Kreta 01 20kg (Suxoy)',
  'dom stroy 22':'Remost 22 25kg (Suxoy)',
  'dom stroy 07 rodband':'Remost 07 rodband 25kg (Suxoy)',
  'dom stroy nalivnoy':'Remost Nalivnoy pol 25kg (Suxoy)',
  'dom stroy oq fasad':'ForGips Oq fasad 20kg (Suxoy)',
  'dom oq fasad':'ForGips Oq fasad 20kg (Suxoy)',
  'standard rodband':'Standart 07',
  'evro mix 21 (2)':'Evromix  21'};
// 1C'dagi klent nomi saytdagidan farq qilsa (norm qilingan 1C nomi -> saytdagi nom)
const CLIENT_ALIASES={'maxmud aka yozyavon':'Mamur aka Yozyavon'};
const PRODUCT_RENAME={'evro mix':'evromix','evro':'evromix','standard':'standart'};
function normalize1CProduct(raw){
  let s=raw.replace(/\s*\(Suxoy\)\s*/gi,'').replace(/\s*\d+\s*kg\b/gi,'').replace(/\buselinniy\b/gi,'').replace(/\bichki\b/gi,'').replace(/\bSaten\b/gi,'Shpaklovka').replace(/\bStroy\b/gi,'').replace(/\bpol\b/gi,'').replace(/\bNalivnoy\b/gi,'Nalivnoy').replace(/\s+/g,' ').trim();
  for(const [k,v] of Object.entries(PRODUCT_RENAME)){s=s.replace(new RegExp('\\b'+k+'\\b','gi'),v);}
  return s;
}
// Sovg'a/promo/xom-ashyo — klent omboridagi qoldiqqa kirmaydi
const NON_PRODUCT_RE=/(fudbolka|kepka|televizor|sovg'?a|pushonka|shaffof|barpo)/i;
function match1CProduct(raw){
  const n=norm(raw);
  if(NON_PRODUCT_RE.test(n))return null;
  // 1. Alias tekshiruv (Concrete 22 = Concrete 75)
  for(const [k,v] of Object.entries(PRODUCT_ALIASES)){if(n.includes(k)){const a=DB.products.find(p=>norm(p.name)===norm(v));if(a)return a;}}
  // 2. Aniq nom bo'yicha
  const exact=DB.products.find(p=>norm(p.name)===n);if(exact)return exact;
  // 3. Tozalangan nom
  const cleaned=normalize1CProduct(raw);const cn=norm(cleaned);
  const m2=DB.products.find(p=>norm(p.name)===cn);if(m2)return m2;
  // 4. Raqam va brand asosida fuzzy
  const nums=(cleaned.match(/\d+/g)||[]).join(' ');
  const brands=['concrete','biora','dom','evromix','standart'];
  let brand='';for(const b of brands){if(cn.includes(b)){brand=b;break;}}
  if(brand){
    const kws=['rodband','shpaklovka','nalivnoy','fasad'];let kw='';for(const k of kws){if(cn.includes(k)){kw=k;break;}}
    const cands=DB.products.filter(p=>{const pn=norm(p.name);return pn.includes(brand)&&(nums?pn.includes(nums):true)&&(kw?pn.includes(kw):true);});
    if(!nums&&!kw)return null;   // faqat brend nomi bilan (raqamsiz) taxmin qilmaymiz
    if(cands.length===1)return cands[0];
    if(cands.length>1){const c2=cands.filter(p=>norm(p.name).includes(kw||nums));if(c2.length===1)return c2[0];return null;}
  }
  return null;
}

// ===== 1C EXCEL PARSER =====
// 1C sotuv fayli FIKSIRLANGAN ustunlar: sana=1, tovar=4, miqdor=7
// Qator turlari (faqat 1-ustunga qarab): sana -> data | "Сум" -> tashlash | matn -> klient sarlavhasi
let IMPORT_1C_ROWS=[];
function cellStr(cell){
  if(!cell)return '';
  let v=cell.value;
  if(v==null)return (cell.text||'').toString().trim();
  if(v instanceof Date)return v.toISOString();
  if(typeof v==='object'){
    if(v.result!=null)return (''+v.result).trim();
    if(Array.isArray(v.richText))return v.richText.map(r=>r.text).join('').trim();
    if(v.text!=null)return (''+v.text).trim();
    return (cell.text||'').toString().trim();
  }
  return (''+v).trim();
}
function cellNum(cell){
  if(!cell)return NaN;
  let v=cell.value;
  if(v&&typeof v==='object'&&v.result!=null)v=v.result;
  if(typeof v==='number')return v;
  const s=(''+(v==null?'':v)).replace(/[^\d.,-]/g,'').replace(/\s/g,'').replace(',','.');
  return parseFloat(s);
}
async function parse1CImport(e){
  const f=e.target.files[0];if(!f)return;
  try{
    const wb=new ExcelJS.Workbook();await wb.xlsx.load(await f.arrayBuffer());
    const parsed=[];let currentClient=null,currentRegion='';
    const cmap={};DB.clients.forEach(c=>cmap[norm(c.name)]=c);
    const COL_DATE=1,COL_PROD=4,COL_QTY=7;
    const dateRe=/^(\d{1,2})\.(\d{2})\.(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/;
    wb.eachSheet(ws=>{
      ws.eachRow((row)=>{
        const c1cell=row.getCell(COL_DATE);
        const c1=cellStr(c1cell);
        const prod=cellStr(row.getCell(COL_PROD));
        // --- 1) sana aniqlash: Date obyekt yoki "dd.mm.yyyy hh:mm" matn
        let date='',time='';const v1=c1cell.value;
        if(v1 instanceof Date){
          date=v1.getUTCFullYear()+'-'+String(v1.getUTCMonth()+1).padStart(2,'0')+'-'+String(v1.getUTCDate()).padStart(2,'0');
          time=String(v1.getUTCHours()).padStart(2,'0')+':'+String(v1.getUTCMinutes()).padStart(2,'0');
        }else{
          const m=c1.match(dateRe);
          if(m){date=m[3]+'-'+m[2]+'-'+m[1].padStart(2,'0');time=(m[4]?m[4].padStart(2,'0')+':'+m[5]:'');}
        }
        // --- DATA QATORI
        if(date){
          if(!currentClient||!prod)return;
          const qty=cellNum(row.getCell(COL_QTY));
          if(!qty||qty<=0)return;
          parsed.push({client:currentClient,region:currentRegion,product:prod,qty,date,time});
          return;
        }
        // --- 2) sana emas: bo'sh / yig'indi / sarlavha
        if(!c1)return;                                   // bo'sh qator
        if(/^(сум|сумма|итого|jami)/i.test(c1))return;   // yig'indi -> tashlash
        // --- KLIENT SARLAVHASI
        const parts=c1.split(',').map(s=>s.trim());
        currentClient=parts[0];currentRegion=parts.slice(1).join(', ');
      });
    });
    if(!parsed.length){$('#imp1cPreview').innerHTML='<div class="warn">Faylda ma\'lumot topilmadi. 1C sotuv Excelini yuklang.</div>';return;}
    // moslashtirish
    const unmatchedP=new Map(),unmatchedC=new Set();let ok=0;
    parsed.forEach(r=>{
      r.c=cmap[norm(r.client)]||(CLIENT_ALIASES[norm(r.client)]&&cmap[norm(CLIENT_ALIASES[norm(r.client)])])||null;if(!r.c){const fuzzy=DB.clients.find(c=>norm(c.name).includes(norm(r.client))||norm(r.client).includes(norm(c.name)));r.c=fuzzy||null;}
      r.p=match1CProduct(r.product);
      if(r.c&&r.p)ok++;
      else{if(!r.c)unmatchedC.add(r.client);if(!r.p)unmatchedP.set(r.product,(unmatchedP.get(r.product)||0)+1);}
    });
    IMPORT_1C_ROWS=parsed.filter(r=>r.c&&r.p);
    const totalClients=new Set(parsed.map(r=>r.client)).size;
    const totalProducts=new Set(parsed.map(r=>r.product)).size;
    let h=`<div class="ok">O'qildi: <b>${parsed.length}</b> qator · <b>${totalClients}</b> klient · <b>${totalProducts}</b> mahsulot. Mos keldi: <b>${ok}</b> ta.</div>`;
    if(unmatchedC.size)h+=`<div class="warn">Mos kelmagan klientlar (${unmatchedC.size}): ${[...unmatchedC].map(esc).join(', ')}</div>`;
    if(unmatchedP.size){h+=`<div class="warn">Mos kelmagan mahsulotlar (${unmatchedP.size}):<br>`;
      unmatchedP.forEach((cnt,name)=>h+=`· <b>${esc(name)}</b> (${cnt} qator)<br>`);h+='</div>';}
    h+='<div class="tbl-wrap" style="max-height:280px;margin-top:8px"><table><thead><tr><th>Sana</th><th>Klient</th><th>Mahsulot (1C→Baza)</th><th class="num">Miqdor</th></tr></thead><tbody>';
    IMPORT_1C_ROWS.slice(0,80).forEach(r=>h+=`<tr><td>${r.date}${r.time?' '+r.time:''}</td><td>${esc(r.c.name)}</td><td>${esc(r.product)} → <b>${esc(r.p.name)}</b></td><td class="num">${r.qty}</td></tr>`);
    h+=`</tbody></table></div><div style="margin-top:14px"><button class="btn green" onclick="confirm1CImport()">✓ ${IMPORT_1C_ROWS.length} ta sotuvni import qilish</button></div>`;
    $('#imp1cPreview').innerHTML=h;
  }catch(err){$('#imp1cPreview').innerHTML='<div class="warn">Faylni o\'qishda xato: '+esc(err.message)+'</div>';}

}
// Takrorni oldini olish: bir xil klent+tovar+sana+vaqt+miqdor allaqachon bo'lsa — qayta qo'shmaymiz.
// (Bir faylni ikki marta yoki ustma-ust davrlarni import qilganda sotuv ikki marta yozilib qolardi.)
function _impKey(clientId,productId,date,time,qty){return [clientId,productId,date,time||'',+qty].join('|');}
function _existingCounter(arr){const m=new Map();(arr||[]).forEach(x=>{const k=_impKey(x.clientId,x.productId,x.date,x.time,x.qty);m.set(k,(m.get(k)||0)+1);});return m;}
async function confirm1CImport(){let n=0,skip=0;const have=_existingCounter(DB.sales);
  IMPORT_1C_ROWS.forEach(r=>{const k=_impKey(r.c.id,r.p.id,r.date,r.time,r.qty);
    if((have.get(k)||0)>0){have.set(k,have.get(k)-1);skip++;return;}
    DB.sales.push({id:nextId(),clientId:r.c.id,productId:r.p.id,qty:r.qty,date:r.date,time:r.time||''});n++;});
  IMPORT_1C_ROWS=[];await saveDB();toast(`${n} ta sotuv import qilindi`+(skip?`, ${skip} ta takror o'tkazildi`:''));
  $('#imp1cPreview').innerHTML='<div class="ok">✓ '+n+' ta yangi sotuv import qilindi'+(skip?' · '+skip+' ta allaqachon bazada bor edi (o\'tkazib yuborildi)':'')+'. Timeline hisobotlarida ko\'rinadi.</div>';$('#slList').innerHTML=salesTable();
}

let IMPORT_ROWS=[];
async function parseImport(e){
  const f=e.target.files[0];if(!f)return;
  try{
    const wb=new ExcelJS.Workbook();await wb.xlsx.load(await f.arrayBuffer());
    const fallback=$('#impDate').value, ftime=$('#impTime').value;
    let parsed=[],titleDate=null;
    wb.eachSheet(ws=>{
      // sarlavhadan sana
      ws.eachRow((row,rn)=>{if(rn>3||titleDate)return;row.eachCell(c=>{const m=(''+(c.text||c.value||'')).match(/(\d{4}-\d{2}-\d{2})/);if(m)titleDate=m[1];});});
      // header qatori
      let hr=null,K=-1,T=-1,Q=-1,S=-1,V=-1;
      ws.eachRow((row,rn)=>{if(hr)return;const t=[];row.eachCell({includeEmpty:true},(c,cn)=>{t[cn]=norm(c.text||c.value||'');});
        const k=t.findIndex(x=>/klent|клиент/.test(x)),tv=t.findIndex(x=>/tovar|товар/.test(x)),q=t.findIndex(x=>/qoldiq|остаток|qoldiq|miqdor/.test(x));
        if(k>0&&tv>0&&q>0){hr=rn;K=k;T=tv;Q=q;S=t.findIndex(x=>/sana|сана|дата/.test(x));V=t.findIndex(x=>/vaqt|время/.test(x));}});
      if(!hr)return;
      ws.eachRow((row,rn)=>{if(rn<=hr)return;
        const cn=row.getCell(K).text||row.getCell(K).value;const tv=row.getCell(T).text||row.getCell(T).value;
        let q=row.getCell(Q).value;if(typeof q==='object'&&q&&q.result!=null)q=q.result;
        if(cn==null||tv==null||q==null||q==='')return;
        let d=fallback;if(S>0){const sv=row.getCell(S).value;if(sv instanceof Date)d=sv.toISOString().slice(0,10);else{const m=(''+sv).match(/(\d{4}-\d{2}-\d{2})/);if(m)d=m[1];}}
        else if(titleDate)d=titleDate;
        let tm=ftime;if(V>0){const vv=''+(row.getCell(V).text||row.getCell(V).value||'');const m=vv.match(/(\d{1,2}:\d{2})/);if(m)tm=m[1];}
        parsed.push({client:(''+cn).trim(),product:(''+tv).trim(),qty:+q,date:d,time:tm});});
    });
    if(!parsed.length){$('#impPreview').innerHTML='<div class="warn">Faylda mos ustunlar (Klent, Tovar, Qoldiq) topilmadi. Bot kunlik hisobotini yuklang.</div>';return;}
    // moslashtirish
    const cmap={};DB.clients.forEach(c=>cmap[norm(c.name)]=c);
    const pmap={};DB.products.forEach(p=>pmap[norm(p.name)]=p);
    let ok=0;const unmatchedC=new Set(),unmatchedP=new Set();
    parsed.forEach(r=>{r.c=cmap[norm(r.client)];r.p=pmap[norm(r.product)];
      if(r.c&&r.p&&!isNaN(r.qty)){ok++;}else{if(!r.c)unmatchedC.add(r.client);if(!r.p)unmatchedP.add(r.product);}});
    IMPORT_ROWS=parsed.filter(r=>r.c&&r.p&&!isNaN(r.qty));
    let h=`<div class="ok">Topildi: <b>${parsed.length}</b> qator. Mos keldi: <b>${ok}</b> ta.</div>`;
    if(unmatchedC.size)h+=`<div class="warn">Mos kelmagan klentlar (${unmatchedC.size}): ${[...unmatchedC].slice(0,10).map(esc).join(', ')}${unmatchedC.size>10?'...':''}</div>`;
    if(unmatchedP.size)h+=`<div class="warn">Mos kelmagan tovarlar (${unmatchedP.size}): ${[...unmatchedP].slice(0,10).map(esc).join(', ')}</div>`;
    h+='<div class="tbl-wrap" style="max-height:300px;margin-top:8px"><table><thead><tr><th>Sana</th><th>Klent</th><th>Tovar</th><th class="num">Qoldiq</th></tr></thead><tbody>';
    IMPORT_ROWS.slice(0,100).forEach(r=>h+=`<tr><td>${r.date} ${r.time||''}</td><td>${esc(r.c.name)}</td><td>${esc(r.p.name)}</td><td class="num">${fmt1(r.qty)}</td></tr>`);
    h+=`</tbody></table></div><div style="margin-top:14px"><button class="btn green" onclick="confirmImport()">✓ ${IMPORT_ROWS.length} ta sanoqni import qilish</button></div>`;
    $('#impPreview').innerHTML=h;
  }catch(err){$('#impPreview').innerHTML='<div class="warn">Faylni o\'qishda xato: '+esc(err.message)+'</div>';}
  e.target.value='';
}
async function confirmImport(){
  const type=($('#impType')&&$('#impType').value)||'count';let n=0;const haveC=_existingCounter(DB.counts);
  IMPORT_ROWS.forEach(r=>{
    if(type!=='initial'){const k=_impKey(r.c.id,r.p.id,r.date,r.time,r.qty);if((haveC.get(k)||0)>0){haveC.set(k,haveC.get(k)-1);return;}}
    if(type==='initial'){DB.initialStock=DB.initialStock.filter(s=>!(s.clientId==r.c.id&&s.productId==r.p.id));DB.initialStock.push({id:nextId(),clientId:r.c.id,productId:r.p.id,qty:r.qty,date:r.date,time:r.time||''});}
    else{DB.counts.push({id:nextId(),clientId:r.c.id,productId:r.p.id,qty:r.qty,date:r.date,time:r.time||''});}
    n++;});
  IMPORT_ROWS=[];await saveDB();toast(`${n} ta yozuv import qilindi`);
  $('#impPreview').innerHTML='<div class="ok">✓ Import tugadi ('+(type==='initial'?"boshlang'ich qoldiq":'sanoq')+').</div>';
  if($('#cnList'))$('#cnList').innerHTML=countTable();
}

function umumiyRows(){const rows=[];DB.clients.forEach(c=>{if(!hasData(c.id))return;clientProducts(c.id).forEach(pid=>{const a=analyzeClientProduct(c.id,pid);rows.push({c,p:productById(pid),a,st:statusOf(a)});});});return rows;}
async function excelUmumiy(){
  const wb=new ExcelJS.Workbook();const ws=wb.addWorksheet('Umumiy hisobot');
  ws.columns=[{header:'Klient',width:28},{header:'Region',width:15},{header:'Tovar',width:22},{header:"Boshlang'ich qoldiq",width:15},{header:'Jami berilgan yuk',width:15},{header:'Oxirgi sanoq',width:12},{header:'Hozirgi qoldiq',width:13},{header:'Jami sotilgan',width:12},{header:"Kunlik o'rtacha",width:13},{header:"Oylik o'rtacha",width:13},{header:'Oxirgi harakat sanasi',width:18},{header:'Turib qolgan kunlar',width:17},{header:'Holat',width:14}];
  const hr=ws.getRow(1);styleHeader(hr);hr.height=22;
  const GREEN={type:'pattern',pattern:'solid',fgColor:{argb:'FFD7F0DF'}},YELLOW={type:'pattern',pattern:'solid',fgColor:{argb:'FFFDF0C7'}},REDF={type:'pattern',pattern:'solid',fgColor:{argb:'FFFAD0D0'}};
  umumiyRows().sort((x,y)=>x.c.name.localeCompare(y.c.name)||ORD[x.st]-ORD[y.st]).forEach(({c,p,a,st})=>{
    const lc=DB.counts.filter(k=>k.clientId==c.id&&k.productId==p.id).sort((m,n)=>dt(n).localeCompare(dt(m)))[0];
    const r=ws.addRow([c.name,c.region,p.name,Math.round(a.init),Math.round(a.delivered),lc?Math.round(lc.qty):'',Math.round(a.current),Math.round(a.sold),Math.round(a.perDay*10)/10,Math.round(a.monthly*10)/10,a.lastDate||'',a.current>0?a.daysSinceLastSale:'',STATUS_TXT[st]]);
    r.eachCell(cc=>cc.border=bd());
    const fill=st==='tez'?GREEN:st==='sekin'?YELLOW:st==='turgan'?REDF:null;if(fill)r.eachCell(cc=>cc.fill=fill);});
  ws.autoFilter={from:{row:1,column:1},to:{row:1,column:13}};ws.views=[{state:'frozen',ySplit:1}];
  await downloadWb(wb,'UMUMIY_HISOBOT.xlsx');
}

function bd(){const s={style:'thin',color:{argb:'FFBFBFBF'}};return {top:s,left:s,right:s,bottom:s};}
function styleHeader(row){row.eachCell(c=>{c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1F4E78'}};c.font={bold:true,color:{argb:'FFFFFFFF'}};c.alignment={horizontal:'center'};c.border=bd();});}
const RED={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFC7CE'}};
async function downloadWb(wb,name){const buf=await wb.xlsx.writeBuffer();const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);toast('Excel yuklab olindi');}
async function excelOverview(){const wb=new ExcelJS.Workbook();const ws=wb.addWorksheet('Umumiy');
  ws.columns=[{header:'Klent',width:30},{header:'Region',width:16},{header:'Tovar xili',width:11},{header:"Boshlang'ich",width:13},{header:'Sotuv berildi',width:12},{header:'Klent sotdi',width:11},{header:'Hozirgi qoldiq',width:15},{header:'Qoldiq summa',width:16},{header:'Oylik sotuv',width:12},{header:'Holat',width:16}];

function buildPeriods(cid,pid){const a=analyzeClientProduct(cid,pid);

  const periods=a.intervals.map(iv=>({from:iv.from,to:iv.to,time:iv.toT,start:iv.startQty,delivered:iv.delivered,delivDate:iv.delivFrom?(iv.delivFrom===iv.delivTo?iv.delivFrom:iv.delivFrom+'…'+iv.delivTo):'',avail:iv.startQty+iv.delivered,counted:iv.endQty,sold:iv.sold,days:iv.days}));
  return {init:a.init,initDate:init?init.date:(periods[0]?periods[0].from:''),periods,current:a.current,sold:a.sold,daysSinceLastSale:a.daysSinceLastSale};}

function initRec(cid,pid){return DB.initialStock.find(s=>s.clientId==cid&&s.productId==pid);}
function clientVisits(cid){const s=new Set();
  DB.sales.filter(x=>x.clientId==cid).forEach(x=>s.add(x.date));
  DB.counts.filter(x=>x.clientId==cid).forEach(x=>s.add(x.date));
  return [...s].sort();}
function clientMatrix(cid){
  const visits=clientVisits(cid);
  const rows=clientProducts(cid).map(pid=>{const a=analyzeClientProduct(cid,pid);const ir=initRec(cid,pid);
    const delBy={};DB.sales.filter(x=>x.clientId==cid&&x.productId==pid).forEach(x=>{delBy[x.date]=(delBy[x.date]||0)+x.qty;});
    const cntBy={};DB.counts.filter(x=>x.clientId==cid&&x.productId==pid).sort((m,n)=>dt(m).localeCompare(dt(n))).forEach(x=>{cntBy[x.date]=x.qty;});
    const soldBy={};a.intervals.forEach(iv=>{soldBy[iv.to]=iv.sold;});
    // Qoldiq sanasi = eng oxirgi tasdiqlangan harakat (sanoq yoki yuk) sanasi
    const allDates=[...Object.keys(delBy),...Object.keys(cntBy)];
    const stockDate=allDates.length?allDates.sort().slice(-1)[0]:'';
    const bv={};visits.forEach(d=>{const ber=delBy[d]||0,has=cntBy[d]!=null;
      if(ber>0||has)bv[d]={berildi:ber,qoldiq:has?cntBy[d]:null,sotdi:has?(soldBy[d]||0):null};});
    return {pid,name:productById(pid).name,init:a.init,initDate:ir?ir.date:'',current:a.current,stockDate,sold:a.sold,price:a.price,monthly:a.monthly,daysSinceLastSale:a.daysSinceLastSale,status:statusOf(a),bv};});
  return {visits,rows};
}
function clientMatrixTable(cid){
  const {visits,rows}=clientMatrix(cid);if(!rows.length)return '<div class="empty">—</div>';
  let h='<div class="tbl-wrap"><table><thead><tr><th rowspan="2">Tovar</th><th rowspan="2" class="num">Boshlang\'ich<br><span class="muted" style="font-weight:400;font-size:10px">sana · qoldiq</span></th>';

  visits.forEach(v=>h+='<th class="num" style="border-left:2px solid #d4def0">Yuk berildi</th><th class="num">Sanoq</th><th class="num">Sotdi</th>');
  h+='</tr></thead><tbody>';
  rows.forEach(r=>{h+=`<tr><td>${esc(r.name)}</td><td class="num">${r.initDate?'<span class="muted" style="font-size:10px">'+r.initDate.slice(5)+'</span><br>':''}${fmt1(r.init)}</td>`;
    visits.forEach(v=>{const c=r.bv[v];
      if(c){const ber=c.berildi?'<b style="color:var(--amber)">+'+fmt1(c.berildi)+'</b>':'—';
        const qol=c.qoldiq!=null?(c.qoldiq<LOW_STOCK?'<span style="color:var(--red);font-weight:700">'+fmt1(c.qoldiq)+'</span>':fmt1(c.qoldiq)):'—';
        const sot=c.sotdi!=null?'<b style="color:var(--green)">'+fmt1(c.sotdi)+'</b>':'—';
        h+=`<td class="num" style="border-left:2px solid #d4def0">${ber}</td><td class="num">${qol}</td><td class="num">${sot}</td>`;}
      else h+='<td class="num" style="border-left:2px solid #d4def0">—</td><td class="num">—</td><td class="num">—</td>';});
    const sit=r.current>0&&r.daysSinceLastSale>=STUCK_DAYS;
    h+=`<td class="num" style="border-left:2px solid #d4def0"><b>${fmt1(r.current)}</b></td><td class="num">${fmt1(r.monthly/30)}</td><td class="center"><span class="pill ${STATUS_CLS[r.status]}">${STATUS_LBL[r.status]}</span></td><td class="num"${sit?' style="color:var(--red);font-weight:700"':''}>${r.current>0?r.daysSinceLastSale+'k':'—'}</td></tr>`;});
  return h+'</tbody></table></div>';
}

// Bitta klient bloki — startRow dan boshlab yozadi, keyingi bo'sh qatorni qaytaradi
function writeClientBlock(ws,cid,startRow){
  const c=clientById(cid);const {visits,rows}=clientMatrix(cid);
  const LBL={ber:'Yuk berildi',qol:'Sanoq',sot:'Sotdi'};
  // Har sana uchun faqat ma'lumoti bor ustunlar (bo'sh ustun yaratilmaydi)
  const blocks=visits.map(d=>{let hb=false,hq=false,hs=false;
    rows.forEach(r=>{const x=r.bv[d];if(x){if(x.berildi>0)hb=true;if(x.qoldiq!=null)hq=true;if(x.sotdi!=null)hs=true;}});
    const cols=[];if(hb)cols.push('ber');if(hq)cols.push('qol');if(hs)cols.push('sot');
    return {date:d,cols};}).filter(b=>b.cols.length>0);
  ws.getCell(startRow,1).value=c.name+' — '+c.region;ws.getCell(startRow,1).font={bold:true,size:13,color:{argb:'FF0D2747'}};
  const h1=startRow+2,h2=startRow+3;
  const r1=['Tovar',"Boshlang'ich sana","Boshlang'ich qoldiq"],r2=['','',''];
  blocks.forEach(b=>b.cols.forEach((k,i)=>{r1.push(i===0?b.date:'');r2.push(LBL[k]);}));
  r1.push('Hozirgi qoldiq','Qoldiq sanasi',"Kunlik o'rt.",'Holat','Turgan kun','Jami sotgan');r2.push('','','','','','');
  r1.forEach((v,i)=>ws.getCell(h1,i+1).value=v);r2.forEach((v,i)=>ws.getCell(h2,i+1).value=v);
  styleHeaderRange(ws,h1,1,r1.length);styleHeaderRange(ws,h2,1,r2.length);
  ws.mergeCells(h1,1,h2,1);ws.mergeCells(h1,2,h2,2);ws.mergeCells(h1,3,h2,3);
  let mc=4;blocks.forEach(b=>{const n=b.cols.length;if(n>1)ws.mergeCells(h1,mc,h1,mc+n-1);mc+=n;});
  for(let i=0;i<6;i++)ws.mergeCells(h1,mc+i,h2,mc+i);
  const lastCol=mc,stockCol=mc+1,soldCol=mc+5;let rr=h2+1;
  let totSold=0,totCur=0;
  rows.forEach(r=>{const cells=[r.name,r.initDate||'',Math.round(r.init)];
    blocks.forEach(b=>{const x=r.bv[b.date];b.cols.forEach(k=>{
      if(!x){cells.push('');return;}
      if(k==='ber')cells.push(x.berildi?Math.round(x.berildi):'');
      else if(k==='qol')cells.push(x.qoldiq!=null?Math.round(x.qoldiq):'');
      else cells.push(x.sotdi!=null?Math.round(x.sotdi):'');});});
    cells.push(Math.round(r.current),r.stockDate||'',Math.round(r.monthly/30*10)/10,STATUS_TXT[r.status],r.current>0?r.daysSinceLastSale:'',Math.round(r.sold));
    cells.forEach((v,i)=>{const cell=ws.getCell(rr,i+1);cell.value=v;cell.border=bd();});
    let k2=4;blocks.forEach(b=>{const x=r.bv[b.date];b.cols.forEach(key=>{
      if(x){if(key==='sot'&&x.sotdi>0)ws.getCell(rr,k2).fill=GREEN;if(key==='qol'&&x.qoldiq!=null&&x.qoldiq<LOW_STOCK)ws.getCell(rr,k2).fill=RED;}
      k2++;});});
    if(r.sold>0)ws.getCell(rr,soldCol).fill=GREEN;
    if(r.current<LOW_STOCK)ws.getCell(rr,lastCol).fill=RED;
    totSold+=r.sold;totCur+=r.current;rr++;});
  // JAMI — shu klient
  ws.getCell(rr,1).value='JAMI — shu klient';
  ws.getCell(rr,lastCol).value=Math.round(totCur);
  ws.getCell(rr,soldCol).value=Math.round(totSold);
  for(let cc=1;cc<=soldCol;cc++){const cell=ws.getCell(rr,cc);cell.border=bd();cell.font={bold:true};cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFF2CC'}};}
  rr++;
  return rr;
}

  const cl=DB.clients.filter(c=>hasData(c.id));if(!cl.length){toast('Ma\'lumot yo\'q');return;}
  const wb=new ExcelJS.Workbook();
  writeSummarySheet(wb,cl);
  const ws=wb.addWorksheet('Klientlar tarixi');
  let maxC=10;cl.forEach(c=>maxC=Math.max(maxC,clientBlockColCount(c.id)));setBlockWidths(ws,maxC);
  let row=1;cl.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(c=>{row=writeClientBlock(ws,c.id,row)+2;});
  await downloadWb(wb,'BARCHA_KLIENTLAR_TARIXI.xlsx');
}

// ===== TOZALASH =====
function clearDataModal(){
  $('#modalHost').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
   <h3>🧹 Ma'lumotlarni tozalash</h3>
   <div class="muted" style="margin-bottom:14px">Qaysi ma'lumotni o'chiramiz? Klent va tovar bazasi saqlanib qoladi.</div>
   <div style="display:flex;flex-direction:column;gap:9px">
     <button class="btn ghost" onclick="doClear('counts')">Sanoqlarni o'chirish (${DB.counts.length} ta)</button>
     <button class="btn ghost" onclick="doClear('sales')">Sotuvlarni o'chirish (${DB.sales.length} ta)</button>
     <button class="btn ghost" onclick="doClear('initial')">Boshlang'ich qoldiqni o'chirish (${DB.initialStock.length} ta)</button>
     <button class="btn danger" onclick="doClear('all')">⚠ HAMMASINI o'chirish</button>
   </div>
   <div class="acts" style="margin-top:18px"><button class="btn ghost" onclick="closeModal()">Yopish</button></div>
  </div></div>`;
}
async function doClear(what){
  const nm={counts:'Sanoqlar',sales:'Sotuvlar',initial:"Boshlang'ich qoldiq",all:'HAMMA kiritilgan ma\'lumot'};
  if(!confirm(nm[what]+' butunlay o\'chirilsinmi? Qaytarib bo\'lmaydi!'))return;
  if(what==='counts')DB.counts=[];else if(what==='sales')DB.sales=[];else if(what==='initial')DB.initialStock=[];
  else{DB.counts=[];DB.sales=[];DB.initialStock=[];}
  await saveDB({noMerge:true});closeModal();render();toast('Tozalandi');
}

// ===== BAZA: KLENT / TOVAR BOSHQARUV =====
let baseSearch='';
function renderBase(){
  $('#content').innerHTML=`<div class="info">Bu yerda klent va tovar bazasini boshqarasiz. Klent yoki tovarni o'chirsangiz, unga bog'liq barcha boshlang'ich qoldiq, yuk berish va sanoqlar ham o'chadi.</div>
  <div class="split">
   <div class="panel"><h2>Klentlar <span class="hint" id="clCount">${DB.clients.length} ta</span></h2>
     <div class="row" style="margin-bottom:14px">
       <div class="field" style="flex:1;min-width:160px"><label>Klent nomi</label><input id="ncName" placeholder="Masalan: Karim aka"></div>
       <div class="field"><label>Region</label><input id="ncRegion" placeholder="Beshariq"></div>
       <div class="field" style="align-self:flex-end"><button class="btn green" onclick="addClient()">+ Qo'shish</button></div>
     </div>
     <div class="search-wrap" style="margin-bottom:10px"><input id="bcSearch" placeholder="Klent qidirish..." value="${esc(baseSearch)}" oninput="baseSearch=this.value;fillClientList()"></div>
     <div id="clientList"></div></div>
   <div class="panel"><h2>Tovarlar <span class="hint" id="prCount">${DB.products.length} ta</span></h2>
     <div class="row" style="margin-bottom:14px">
       <div class="field" style="flex:1;min-width:150px"><label>Tovar nomi</label><input id="npName" placeholder="Concrete 22"></div>
       <div class="field"><label>Narx (so'm)</label><input id="npPrice" type="number" placeholder="22000"></div>
       <div class="field" style="align-self:flex-end"><button class="btn green" onclick="addProduct()">+ Qo'shish</button></div>
     </div>
     <div id="productList"></div></div>
  </div>`;
  fillClientList();fillProductList();
}
function fillClientList(){
  let arr=[...DB.clients].sort((a,b)=>a.name.localeCompare(b.name));
  if(baseSearch)arr=arr.filter(c=>c.name.toLowerCase().includes(baseSearch.toLowerCase())||(c.region||'').toLowerCase().includes(baseSearch.toLowerCase()));
  let h='<div class="tbl-wrap" style="max-height:54vh"><table><thead><tr><th>Klent</th><th>Region</th><th class="num">Ma\'lumot</th><th></th></tr></thead><tbody>';
  if(!arr.length)h+='<tr><td colspan="4"><div class="empty">Topilmadi</div></td></tr>';
  arr.forEach(c=>{const n=clientProducts(c.id).length;
    h+=`<tr><td>${esc(c.name)}</td><td><span class="region-tag">${esc(c.region||'')}</span></td><td class="num muted">${n?n+' tovar':'—'}</td><td class="right"><button class="btn icon" onclick="editClient(${c.id})">✎</button> <button class="btn icon" onclick="delClient(${c.id})">✕</button></td></tr>`;});
  $('#clientList').innerHTML=h+'</tbody></table></div>';
  const cc=$('#clCount');if(cc)cc.textContent=DB.clients.length+' ta';
}
function fillProductList(){
  let h='<div class="tbl-wrap" style="max-height:54vh"><table><thead><tr><th>Tovar</th><th class="num">Narx</th><th class="num">Ma\'lumot</th><th></th></tr></thead><tbody>';
  if(!DB.products.length)h+='<tr><td colspan="4"><div class="empty">Yo\'q</div></td></tr>';
  DB.products.forEach(p=>{let used=0;DB.clients.forEach(c=>{if(clientProducts(c.id).includes(p.id))used++;});
    h+=`<tr><td>${esc(p.name)}</td><td class="num">${fmt(p.price)}</td><td class="num muted">${used?used+' klent':'—'}</td><td class="right"><button class="btn icon" onclick="editProduct(${p.id})">✎</button> <button class="btn icon" onclick="delProduct(${p.id})">✕</button></td></tr>`;});
  $('#productList').innerHTML=h+'</tbody></table></div>';
  const pc=$('#prCount');if(pc)pc.textContent=DB.products.length+' ta';
}
function nextClientId(){return (DB.clients.reduce((m,c)=>Math.max(m,+c.id||0),0))+1;}
function nextProductId(){return (DB.products.reduce((m,p)=>Math.max(m,+p.id||0),0))+1;}
async function addClient(){const name=$('#ncName').value.trim(),region=$('#ncRegion').value.trim();
  if(!name){toast('Klent nomini kiriting');return;}
  if(DB.clients.some(c=>norm(c.name)===norm(name))){toast('Bu klent allaqachon bor');return;}
  DB.clients.push({id:nextClientId(),name,region:region||'—'});await saveDB();$('#ncName').value='';$('#ncRegion').value='';fillClientList();toast('Klent qo\'shildi');}
async function delClient(id){const c=clientById(id);if(!c)return;const n=clientProducts(id).length;
  if(!confirm(`"${c.name}" o'chirilsinmi?`+(n?` Unga bog'liq ${n} tovar bo'yicha barcha boshlang'ich/yuk/sanoq ham o'chadi.`:'')+' Qaytarib bo\'lmaydi!'))return;
  DB.clients=DB.clients.filter(x=>x.id!=id);DB.initialStock=DB.initialStock.filter(x=>x.clientId!=id);DB.sales=DB.sales.filter(x=>x.clientId!=id);DB.counts=DB.counts.filter(x=>x.clientId!=id);
  await saveDB();fillClientList();toast('O\'chirildi');}
function editClient(id){const c=clientById(id);if(!c)return;
  $('#modalHost').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>✎ Klentni tahrirlash</h3>
    <div class="row"><div class="field" style="flex:1"><label>Nomi</label><input id="ecName" value="${esc(c.name)}"></div></div>
    <div class="row"><div class="field" style="flex:1"><label>Region</label><input id="ecRegion" value="${esc(c.region||'')}"></div></div>
    <div class="acts"><button class="btn ghost" onclick="closeModal()">Bekor</button><button class="btn green" onclick="saveClient(${id})">Saqlash</button></div></div></div>`;}
async function saveClient(id){const c=clientById(id);if(!c)return;c.name=$('#ecName').value.trim()||c.name;c.region=$('#ecRegion').value.trim()||c.region;await saveDB();closeModal();fillClientList();toast('Saqlandi');}
async function addProduct(){const name=$('#npName').value.trim(),price=+$('#npPrice').value;
  if(!name){toast('Tovar nomini kiriting');return;}
  if(DB.products.some(p=>norm(p.name)===norm(name))){toast('Bu tovar allaqachon bor');return;}
  DB.products.push({id:nextProductId(),name,price:isNaN(price)?0:price,unit:'dona'});await saveDB();$('#npName').value='';$('#npPrice').value='';fillProductList();toast('Tovar qo\'shildi');}
async function delProduct(id){const p=productById(id);if(!p)return;let used=0;DB.clients.forEach(c=>{if(clientProducts(c.id).includes(id))used++;});
  if(!confirm(`"${p.name}" o'chirilsinmi?`+(used?` ${used} klentdagi shu tovar bo'yicha barcha yozuvlar ham o'chadi.`:'')+' Qaytarib bo\'lmaydi!'))return;
  DB.products=DB.products.filter(x=>x.id!=id);DB.initialStock=DB.initialStock.filter(x=>x.productId!=id);DB.sales=DB.sales.filter(x=>x.productId!=id);DB.counts=DB.counts.filter(x=>x.productId!=id);
  await saveDB();fillProductList();toast('O\'chirildi');}
function editProduct(id){const p=productById(id);if(!p)return;
  $('#modalHost').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>✎ Tovarni tahrirlash</h3>
    <div class="row"><div class="field" style="flex:1"><label>Nomi</label><input id="epName" value="${esc(p.name)}"></div></div>
    <div class="row"><div class="field" style="flex:1"><label>Narx</label><input id="epPrice" type="number" value="${p.price}"></div></div>
    <div class="acts"><button class="btn ghost" onclick="closeModal()">Bekor</button><button class="btn green" onclick="saveProduct(${id})">Saqlash</button></div></div></div>`;}
async function saveProduct(id){const p=productById(id);if(!p)return;p.name=$('#epName').value.trim()||p.name;const pr=+$('#epPrice').value;if(!isNaN(pr))p.price=pr;await saveDB();closeModal();fillProductList();toast('Saqlandi');}

// ===== JSON =====
function exportJSON(){const blob=new Blob([JSON.stringify(DB)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=`cp_sklad_backup_${today()}.json`;a.click();URL.revokeObjectURL(u);toast('Zaxira yuklab olindi');}
async function importJSON(e){const f=e.target.files[0];if(!f)return;const txt=await f.text();
  try{const d=JSON.parse(txt);if(!d.clients||!d.products)throw 0;if(!confirm('Hozirgi ma\'lumot almashtiriladi. Davom etamizmi?'))return;
    DB=d;DB.initialStock=DB.initialStock||[];DB.sales=DB.sales||[];DB.counts=DB.counts||[];DB.seq=DB.seq||1;await saveDB({noMerge:true});render();toast('Import qilindi');
  }catch(err){toast('Fayl noto\'g\'ri');}e.target.value='';}

// ===== selects =====
function clientSelect(id,sel){const byReg={};DB.clients.forEach(c=>{(byReg[c.region]=byReg[c.region]||[]).push(c);});
  let h=`<select id="${id}"><option value="">— tanlang —</option>`;
  Object.keys(byReg).sort().forEach(r=>{h+=`<optgroup label="${esc(r)}">`;byReg[r].sort((a,b)=>a.name.localeCompare(b.name)).forEach(c=>h+=`<option value="${c.id}" ${sel==c.id?'selected':''}>${esc(c.name)}</option>`);h+='</optgroup>';});return h+'</select>';}
function productSelect(id){let h=`<select id="${id}"><option value="">— tanlang —</option>`;DB.products.forEach(p=>h+=`<option value="${p.id}">${esc(p.name)}</option>`);return h+'</select>';}

(async function(){await loadDB();render();})();

</script>
